name: Pre-Commit

on:
  pull_request:
    branches:
      - main
      - master

env:
  TERRAFORM_DOCS_VERSION: v0.20.0
  TFLINT_VERSION: v0.59.1

jobs:
  collectInputs:
    name: Collect workflow inputs
    runs-on: ubuntu-latest
    outputs:
      directories: ${{ steps.dirs.outputs.directories }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Test action input handling
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/action-input-tests"
          "$RUNNER_TEMP/action-input-tests/bin/pip" install --disable-pip-version-check PyYAML==6.0.3
          "$RUNNER_TEMP/action-input-tests/bin/python" -m unittest discover -s tests -v

      - name: Get root directories
        id: dirs
        uses: ./directories

  preCommitMinVersions:
    name: Min TF pre-commit
    needs: collectInputs
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    strategy:
      matrix:
        directory: ${{ fromJson(needs.collectInputs.outputs.directories) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Terraform min/max versions
        id: minMax
        uses: clowdhaus/terraform-min-max@a86951cbe89f4d15caec805f36aa1dd68863ae32 # v2.1.0
        with:
          directory: ${{ matrix.directory }}

      - name: Mint private hook read token
        id: ci-reader
        uses: Nofraud/reusable-gh-actions/.github/actions/octo-sts-token@production
        with:
          broker: ci-reader
          scope: Nofraud/terraform-custom-checks
          identity: terraform-composite-actions

      - name: Pre-commit Terraform ${{ steps.minMax.outputs.minVersion }}
        # Run only validate pre-commit check on min version supported
        if: ${{ matrix.directory !=  '.' }}
        uses: ./pre-commit
        env:
          CI_READER_TOKEN: ${{ steps.ci-reader.outputs.token }}
          GIT_CONFIG_COUNT: '2'
          GIT_CONFIG_KEY_0: credential.https://github.com/Nofraud/terraform-custom-checks.useHttpPath
          GIT_CONFIG_VALUE_0: 'true'
          GIT_CONFIG_KEY_1: credential.https://github.com/Nofraud/terraform-custom-checks.helper
          GIT_CONFIG_VALUE_1: '!f() { if [ "$1" = get ]; then printf "%s\n" "username=x-access-token" "password=$CI_READER_TOKEN"; fi; }; f'
        with:
          terraform-version: ${{ steps.minMax.outputs.minVersion }}
          tflint-version: ${{ env.TFLINT_VERSION }}
          args: 'terraform_validate --color=always --show-diff-on-failure --files ${{ matrix.directory }}/*'

      - name: Pre-commit Terraform ${{ steps.minMax.outputs.minVersion }}
        # Run only validate pre-commit check on min version supported
        if: ${{ matrix.directory ==  '.' }}
        uses: ./pre-commit
        env:
          CI_READER_TOKEN: ${{ steps.ci-reader.outputs.token }}
          GIT_CONFIG_COUNT: '2'
          GIT_CONFIG_KEY_0: credential.https://github.com/Nofraud/terraform-custom-checks.useHttpPath
          GIT_CONFIG_VALUE_0: 'true'
          GIT_CONFIG_KEY_1: credential.https://github.com/Nofraud/terraform-custom-checks.helper
          GIT_CONFIG_VALUE_1: '!f() { if [ "$1" = get ]; then printf "%s\n" "username=x-access-token" "password=$CI_READER_TOKEN"; fi; }; f'
        with:
          terraform-version: ${{ steps.minMax.outputs.minVersion }}
          tflint-version: ${{ env.TFLINT_VERSION }}
          args: 'terraform_validate --color=always --show-diff-on-failure --files $(ls *.tf)'

      - name: Selected Terraform version
        run: terraform version

  preCommitMaxVersion:
    name: Max TF pre-commit
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    needs: collectInputs
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{github.event.pull_request.head.repo.full_name}}

      - name: Terraform min/max versions
        id: minMax
        uses: clowdhaus/terraform-min-max@a86951cbe89f4d15caec805f36aa1dd68863ae32 # v2.1.0

      - name: Mint private hook read token
        id: ci-reader
        uses: Nofraud/reusable-gh-actions/.github/actions/octo-sts-token@production
        with:
          broker: ci-reader
          scope: Nofraud/terraform-custom-checks
          identity: terraform-composite-actions

      - name: Pre-commit Terraform ${{ steps.minMax.outputs.maxVersion }}
        uses: ./pre-commit
        env:
          CI_READER_TOKEN: ${{ steps.ci-reader.outputs.token }}
          GIT_CONFIG_COUNT: '2'
          GIT_CONFIG_KEY_0: credential.https://github.com/Nofraud/terraform-custom-checks.useHttpPath
          GIT_CONFIG_VALUE_0: 'true'
          GIT_CONFIG_KEY_1: credential.https://github.com/Nofraud/terraform-custom-checks.helper
          GIT_CONFIG_VALUE_1: '!f() { if [ "$1" = get ]; then printf "%s\n" "username=x-access-token" "password=$CI_READER_TOKEN"; fi; }; f'
        with:
          terraform-version: ${{ steps.minMax.outputs.maxVersion }}
          terraform-docs-version: ${{ env.TERRAFORM_DOCS_VERSION }}
          tflint-version: ${{ env.TFLINT_VERSION }}
          install-hcledit: true
          parallelize-init: true

      - name: check
        run: hcledit --help

      - name: Selected Terraform version
        run: terraform version
