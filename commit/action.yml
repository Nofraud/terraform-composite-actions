name: commit
description: Commit and push any changes to branch specified
inputs:
  git-branch:
    description: Git branch to push changes to (if any)
    required: true
  github-repository:
    description: GitHub repository where changes will be pushed
    required: true
  github-token:
    description: GitHub personal access token with `repo` access to permit pushing changes to `git-branch`
    required: true

runs:
  using: composite
  steps:
    - name: Commit files
      shell: bash
      env:
        COMMIT_GITHUB_TOKEN: ${{ inputs.github-token }}
        COMMIT_GITHUB_REPOSITORY: ${{ inputs.github-repository }}
        COMMIT_GIT_BRANCH: ${{ inputs.git-branch }}
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git commit -m 'chore: auto format and update docs' -a || echo 'Nothing to update'
        remote_repo="https://${GITHUB_ACTOR}:${COMMIT_GITHUB_TOKEN}@github.com/${COMMIT_GITHUB_REPOSITORY}.git"
        git push "${remote_repo}" "HEAD:${COMMIT_GIT_BRANCH}" || true
