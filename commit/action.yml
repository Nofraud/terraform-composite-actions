name: commit
description: Commit and push any changes to branch specified
inputs:
  git-branch:
    description: Git branch to push changes to (if any)
    required: true
  github-repository:
    description: GitHub repository where changes will be pushed
    required: true
  github-token:
    description: GitHub personal access token with `repo` access to permit pushing changes to `git-branch`
    required: true

runs:
  using: composite
  steps:
    - name: Commit files
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        TARGET_REPOSITORY: ${{ inputs.github-repository }}
        GIT_BRANCH: ${{ inputs.git-branch }}
      run: |
        if [[ ! "$TARGET_REPOSITORY" =~ ^[A-Za-z0-9][A-Za-z0-9-]*/[A-Za-z0-9_.-]+$ ]]; then
          echo "::error::github-repository must be owner/repository"
          exit 1
        fi
        git check-ref-format --branch "$GIT_BRANCH" >/dev/null
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git commit -m 'chore: auto format and update docs' -a || echo 'Nothing to update'
        remote_repo="https://${GITHUB_ACTOR}:${GITHUB_TOKEN}@github.com/${TARGET_REPOSITORY}.git"
        git push "${remote_repo}" "HEAD:${GIT_BRANCH}" || true
