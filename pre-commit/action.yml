name: pre-commit
description: Execute pre-commit for Terraform codebase
inputs:
  terraform-version:
    description: Terraform version supported for use in evaluation. Required when use-opentofu is false.
    required: false
  terraform-docs-version:
    description: Version of terraform-docs to use when evaluating checks
    required: false
    default: v0.20.0
  tflint-version:
    description: Version of tflint to use when evaluating checks
    required: false
    default: latest
  args:
    description: Arguments to pass to pre-commit
    required: false
    default: '--all-files --color always --show-diff-on-failure'
  install-hcledit:
    description: Install hcledit for pre-commit
    required: false
    default: 'false'
  hcledit-version:
    description: Version of hcledit to install when `install-hcledit` is true
    required: false
    default: 0.2.17
  install-tfsec:
    description: Install tfsec for pre-commit
    required: false
    default: 'false'
  tfsec-version:
    description: Version of tfsec to install when `install-tfsec` is true
    required: false
    default: 1.28.14
  install-trivy:
    description: Install trivy for pre-commit
    required: false
    default: 'false'
  trivy-version:
    description: Version of trivy to install when `install-trivy` is true
    required: false
    default: 0.69.2
  parallelize-init:
    description: Whether to parallelize 'terraform init' across directories
    required: false
    default: 'false'
  use-opentofu:
    description: 'Use OpenTofu instead of Terraform. When true, installs OpenTofu and sets PCT_TFPATH to ensure pre-commit hooks use tofu.'
    required: false
    default: 'false'
  opentofu-version:
    description: 'The version of OpenTofu to install when use-opentofu is true'
    required: false
    default: '1.11.4'

runs:
  using: composite
  steps:
    - name: Validate version inputs
      shell: bash
      env:
        USE_OPENTOFU: ${{ inputs.use-opentofu }}
        TERRAFORM_VERSION: ${{ inputs.terraform-version }}
        OPENTOFU_VERSION: ${{ inputs.opentofu-version }}
        TERRAFORM_DOCS_VERSION: ${{ inputs.terraform-docs-version }}
        TFLINT_VERSION: ${{ inputs.tflint-version }}
        INSTALL_HCLEDIT: ${{ inputs.install-hcledit }}
        HCLEDIT_VERSION: ${{ inputs.hcledit-version }}
        INSTALL_TFSEC: ${{ inputs.install-tfsec }}
        TFSEC_VERSION: ${{ inputs.tfsec-version }}
        INSTALL_TRIVY: ${{ inputs.install-trivy }}
        TRIVY_VERSION: ${{ inputs.trivy-version }}
      run: |
        require_version() {
          local name="$1" value="$2" prefix="${3:-}"
          if [[ ! "$value" =~ ^${prefix}[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::$name must be a release version"
            exit 1
          fi
        }

        for flag in USE_OPENTOFU INSTALL_HCLEDIT INSTALL_TFSEC INSTALL_TRIVY; do
          if [[ "${!flag}" != "true" && "${!flag}" != "false" ]]; then
            echo "::error::$flag must be true or false"
            exit 1
          fi
        done

        if [[ "$USE_OPENTOFU" == "true" ]]; then
          require_version opentofu-version "$OPENTOFU_VERSION"
        else
          require_version terraform-version "$TERRAFORM_VERSION"
        fi
        require_version terraform-docs-version "$TERRAFORM_DOCS_VERSION" v
        if [[ "$TFLINT_VERSION" != "latest" ]]; then
          require_version tflint-version "$TFLINT_VERSION" v
        fi
        if [[ "$INSTALL_HCLEDIT" == "true" ]]; then
          require_version hcledit-version "$HCLEDIT_VERSION"
        fi
        if [[ "$INSTALL_TFSEC" == "true" ]]; then
          require_version tfsec-version "$TFSEC_VERSION"
        fi
        if [[ "$INSTALL_TRIVY" == "true" ]]; then
          require_version trivy-version "$TRIVY_VERSION"
        fi

    - name: Determine OS and Architecture
      id: os_arch
      shell: bash
      run: |
        os=$(uname -s | tr '[:upper:]' '[:lower:]')
        case "$os" in
            linux)
                trivy_os="Linux"
                rg_vendor_os="unknown-linux"
                ;;
            darwin)
                trivy_os="macOS"
                rg_vendor_os="apple-darwin"
                ;;
            windows)
                trivy_os="Windows"
                rg_vendor_os="pc-windows"
                ;;
        esac

        arch=$(uname -m)
        case $arch in
            "x86_64")
                arch="amd64"
                trivy_arch="64bit"

                case $os in
                  linux)
                    rg_target="x86_64-unknown-linux-musl"
                    ;;
                  darwin)
                    rg_target="x86_64-apple-darwin"
                    ;;
                esac

                ;;
            "i386" | "i686")
                arch="386"
                trivy_arch="32bit"

                case $os in
                  linux)
                    rg_target="i386-unknown-linux-gnu"
                    ;;
                esac

                ;;
            "aarch64")
                arch="arm64"
                trivy_arch="ARM64"

                case $os in
                  linux)
                    rg_target="aarch64-unknown-linux-gnu"
                    ;;
                  darwin)
                    rg_target="aarch64-apple-darwin"
                    ;;
                esac

                ;;
            "armv7l")
                arch="arm"
                trivy_arch="ARM"

                case $os in
                  linux)
                    rg_target="armv7-unknown-linux-gnueabihf"
                    ;;
                esac

                ;;
        esac

        echo "OS=$os" >> $GITHUB_ENV
        echo "ARCH=$arch" >> $GITHUB_ENV
        echo "TRIVY_OS=$trivy_os" >> $GITHUB_ENV
        echo "TRIVY_ARCH=$trivy_arch" >> $GITHUB_ENV
        echo "RG_TARGET=$rg_target" >> $GITHUB_ENV

    - name: Install OpenTofu v${{ inputs.opentofu-version }}
      if: inputs.use-opentofu == 'true'
      shell: bash
      env:
        OPENTOFU_VERSION: ${{ inputs.opentofu-version }}
      run: |
        curl --retry 3 --retry-all-errors --retry-delay 3 -sSLo ./tofu.zip "https://github.com/opentofu/opentofu/releases/download/v${OPENTOFU_VERSION}/tofu_${OPENTOFU_VERSION}_${{ env.OS }}_${{ env.ARCH }}.zip"
        sudo unzip -qq tofu.zip tofu -d /usr/bin/
        rm tofu.zip 2> /dev/null

    - name: Set PCT_TFPATH for OpenTofu
      if: inputs.use-opentofu == 'true'
      shell: bash
      run: echo "PCT_TFPATH=tofu" >> $GITHUB_ENV

    - name: Install Terraform v${{ inputs.terraform-version }}
      if: inputs.use-opentofu != 'true'
      shell: bash
      env:
        TERRAFORM_VERSION: ${{ inputs.terraform-version }}
      run: |
        terraform_path=$(command -v terraform || true)
        if [[ -n "$terraform_path" ]]; then
          rm -f -- "$terraform_path"
        fi
        curl --retry 3 --retry-all-errors --retry-delay 3 -sSLo ./terraform.zip "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_${{ env.OS }}_${{ env.ARCH }}.zip"
        sudo unzip -qq terraform.zip terraform -d /usr/bin/
        rm terraform.zip 2> /dev/null

    - name: Install pre-commit
      shell: bash
      run: |
        mkdir -p ~/.venv
        python3 -m venv ~/.venv
        source ~/.venv/bin/activate
        pip install -q pre-commit

    - name: Install terraform-docs
      shell: bash
      env:
        TERRAFORM_DOCS_VERSION: ${{ inputs.terraform-docs-version }}
      run: |
        curl --retry 3 --retry-all-errors --retry-delay 3 -sSLo ./terraform-docs.tar.gz "https://github.com/terraform-docs/terraform-docs/releases/download/${TERRAFORM_DOCS_VERSION}/terraform-docs-${TERRAFORM_DOCS_VERSION}-${{ env.OS }}-${{ env.ARCH }}.tar.gz"
        sudo tar -xzf terraform-docs.tar.gz -C /usr/bin/ terraform-docs
        rm terraform-docs.tar.gz 2> /dev/null

    - name: Install tflint
      shell: bash
      env:
        TFLINT_VERSION: ${{ inputs.tflint-version }}
      run: |
        tflint_path=$(command -v tflint || true)
        if [[ -n "$tflint_path" ]]; then
          rm -f -- "$tflint_path"
        fi

        if [[ "${TFLINT_VERSION}" == "latest" ]]; then
          curl --retry 3 --retry-all-errors --retry-delay 3 -sSL "$(curl --retry 3 --retry-all-errors --retry-delay 3 -s https://api.github.com/repos/terraform-linters/tflint/releases/latest | grep -o -E "https://.+?_${{ env.OS }}_${{ env.ARCH }}.zip")" > tflint.zip
        else
          curl --retry 3 --retry-all-errors --retry-delay 3 -sSLo ./tflint.zip "https://github.com/terraform-linters/tflint/releases/download/${TFLINT_VERSION}/tflint_${{ env.OS }}_${{ env.ARCH }}.zip"
        fi
        sudo unzip -qq tflint.zip tflint -d /usr/bin/
        rm tflint.zip 2> /dev/null

    - name: Install hcledit
      shell: bash
      if: ${{ inputs.install-hcledit == 'true' }}
      env:
        HCLEDIT_VERSION: ${{ inputs.hcledit-version }}
      run: |
        curl --retry 3 --retry-all-errors --retry-delay 3 -sSLo ./hcledit.tar.gz "https://github.com/minamijoyo/hcledit/releases/download/v${HCLEDIT_VERSION}/hcledit_${HCLEDIT_VERSION}_${{ env.OS }}_${{ env.ARCH }}.tar.gz"
        sudo tar -xzf hcledit.tar.gz -C /usr/bin/ hcledit
        rm hcledit.tar.gz 2> /dev/null

    - name: Install tfsec
      shell: bash
      if: ${{ inputs.install-tfsec == 'true' }}
      env:
        TFSEC_VERSION: ${{ inputs.tfsec-version }}
      run: |
        curl --retry 3 --retry-all-errors --retry-delay 3 -sSLo ./tfsec.tar.gz "https://github.com/aquasecurity/tfsec/releases/download/v${TFSEC_VERSION}/tfsec_${TFSEC_VERSION}_${{ env.OS }}_${{ env.ARCH }}.tar.gz"
        sudo tar -xzf tfsec.tar.gz -C /usr/bin/ tfsec tfsec-checkgen
        rm tfsec.tar.gz 2> /dev/null

    - name: Install trivy
      shell: bash
      if: ${{ inputs.install-trivy == 'true' }}
      env:
        TRIVY_VERSION: ${{ inputs.trivy-version }}
      run: |
        TRIVY_FILE="trivy_${TRIVY_VERSION}_${{ env.TRIVY_OS }}-${{ env.TRIVY_ARCH }}.tar.gz"
        curl --retry 3 --retry-all-errors --retry-delay 3 -sSLo "./trivy.tar.gz" "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${TRIVY_FILE}"
        curl --retry 3 --retry-all-errors --retry-delay 3 -sSLo "./trivy_checksums.txt" "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_checksums.txt"
        EXPECTED_SHA=$(grep "${TRIVY_FILE}" ./trivy_checksums.txt | awk '{print $1}')
        if [ -z "${EXPECTED_SHA}" ]; then
          echo "::error::Could not find checksum for ${TRIVY_FILE} in checksums file"
          exit 1
        fi
        ACTUAL_SHA=$(sha256sum ./trivy.tar.gz | awk '{print $1}')
        if [ "${EXPECTED_SHA}" != "${ACTUAL_SHA}" ]; then
          echo "::error::SHA256 checksum mismatch for trivy ${TRIVY_FILE}!"
          echo "  Expected: ${EXPECTED_SHA}"
          echo "  Actual:   ${ACTUAL_SHA}"
          exit 1
        fi
        echo "SHA256 checksum verified for trivy ${TRIVY_FILE}: ${ACTUAL_SHA}"
        sudo tar -xzf trivy.tar.gz -C /usr/bin/ trivy
        rm trivy.tar.gz trivy_checksums.txt 2> /dev/null

    - name: Initialize directories in parallel
      shell: bash
      if: ${{ inputs.parallelize-init == 'true' }}
      run: |
        curl --retry 3 --retry-all-errors --retry-delay 3 -sSLo ./ripgrep.tar.gz https://github.com/BurntSushi/ripgrep/releases/download/15.0.0/ripgrep-15.0.0-${{ env.RG_TARGET }}.tar.gz
        tar -xzf ripgrep.tar.gz
        mv ripgrep-15.0.0-${{ env.RG_TARGET }}/rg /usr/local/bin/
        rm -rf ripgrep* 2> /dev/null
        DIRS=$(rg -l -ttf --null required_version . | xargs -0 dirname | uniq)
        INIT_CMD="${PCT_TFPATH:-terraform}"
        echo "$DIRS" | xargs -n 1 -P 4 -I {} bash -c 'cd "{}" && '"$INIT_CMD"' init -input=false -no-color || true'

    - name: Execute pre-commit
      shell: bash
      env:
        PRE_COMMIT_ARGS: ${{ inputs.args }}
      run: |
        # shellcheck source=/dev/null
        source ~/.venv/bin/activate
        python3 - <<'PY'
        import glob
        import os
        import re
        import shlex
        import sys

        raw = os.environ["PRE_COMMIT_ARGS"]
        try:
            args = shlex.split(raw)
        except ValueError as error:
            sys.exit(f"::error::Invalid pre-commit arguments: {error}")

        # Keep quote boundaries so a quoted wildcard stays literal.
        parts = re.compile(r"""[^\s'"\\]+|'[^']*'|"(?:\\.|[^"\\])*"|\\.""", re.DOTALL)
        words = re.findall(r"""(?:[^\s'"\\]+|'[^']*'|"(?:\\.|[^"\\])*"|\\.)+""", raw, re.DOTALL)
        if len(words) != len(args):
            sys.exit("::error::Invalid pre-commit argument boundaries")

        expanded = []
        index = 0
        while index < len(words):
            # Older callers use this exact expression to select root TF files.
            if words[index:index + 2] == ["$(ls", "*.tf)"] and "--files" in expanded:
                expanded.extend(sorted(glob.glob("*.tf")))
                index += 2
                continue

            pattern = ""
            has_glob = False
            for part in parts.findall(words[index]):
                if part[0] in "'\"\\":
                    pattern += glob.escape(shlex.split(part)[0])
                else:
                    pattern += part
                    has_glob = has_glob or glob.has_magic(part)
            matches = sorted(glob.glob(pattern)) if has_glob else []
            expanded.extend(matches or [args[index]])
            index += 1

        os.execvp("pre-commit", ["pre-commit", "run", *expanded])
        PY

    - name: Cleanup venv
      shell: bash
      run: |
        rm -rf .venv
